name: Build Prisma Command

on:
  push:
    branches:
      - main
    paths:
      - "command-service/src/prisma/schema.prisma"
      - "command-service/prisma.Dockerfile"
      - "command-service/package.json"
      - "command-service/pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  prisma-command:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Prisma Command Image
        run: |
          docker build \
            -f command-service/prisma.Dockerfile \
            -t hansongyi/autotrace-prisma-command:latest \
            command-service

      - name: Push Prisma Command Image
        run: |
          docker push hansongyi/autotrace-prisma-command:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Prisma Command DB Push
        run: |
          kubectl delete job prisma-command-db-push \
            -n autotrace \
            --ignore-not-found

          sed "s|IMAGE_PLACEHOLDER|hansongyi/autotrace-prisma-command:latest|g" \
            k8s/prisma-command-job.yaml \
            | kubectl apply -f -

      - name: Wait for Prisma Command DB Push
        run: |
          kubectl wait \
            --for=condition=complete \
            --timeout=300s \
            job/prisma-command-db-push \
            -n autotrace
