apiVersion: apps/v1
kind: Deployment
metadata:
  name: command
  namespace: autotrace
spec:
  replicas: 2

  selector:
    matchLabels:
      app: command

  template:
    metadata:
      labels:
        app: command

    spec:
      containers:
        - name: command
          image: hansongyi/autotrace-command:latest

          ports:
            - containerPort: 3000

          env:
            - name: MARIADB_HOST
              value: "mariadb"

            - name: MARIADB_PORT
              value: "3306"

            - name: MARIADB_USER
              value: "root"

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD

            - name: MARIADB_DATABASE
              value: "autotrace"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
