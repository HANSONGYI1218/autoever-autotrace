apiVersion: apps/v1
kind: Deployment
metadata:
  name: command
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command
  template:
    metadata:
      labels:
        app: command
    spec:
      containers:
        - name: command
          image: YOUR_DOCKERHUB_ID/todo-command:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: mariadb-service

            - name: DB_PORT
              value: "3306"

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: DB_PASSWORD

            - name: DB_NAME
              value: testdb

---
apiVersion: v1
kind: Service
metadata:
  name: command-service
spec:
  selector:
    app: command
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
