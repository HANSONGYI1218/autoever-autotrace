apiVersion: apps/v1
kind: Deployment
metadata:
  name: query
  namespace: autotrace
spec:
  replicas: 2

  selector:
    matchLabels:
      app: query

  template:
    metadata:
      labels:
        app: query

    spec:
      containers:
        - name: query
          image: hansongyi/autotrace-query:latest

          ports:
            - containerPort: 3001

          env:
            - name: MONGO_URI
              value: "mongodb://mongodb:27017"

            - name: MONGO_DB
              value: "autotrace"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
