apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autotrace-ingress
  namespace: autotrace
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
  ingressClassName: nginx

  rules:
    - host: autotrace.local
      http:
        paths:
          - path: /api/command
            pathType: Prefix
            backend:
              service:
                name: command-service
                port:
                  number: 3000

          - path: /api/query
            pathType: Prefix
            backend:
              service:
                name: query-service
                port:
                  number: 3001

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
