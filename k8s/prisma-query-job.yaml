name: Build Prisma Query

on:
  push:
    branches:
      - main
    paths:
      - "query-service/src/prisma/schema.prisma"
  workflow_dispatch:

jobs:
  prisma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Query
        uses: docker/build-push-action@v7
        with:
          context: ./query-service
          file: ./query-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hansongyi/autotrace-query:latest
            hansongyi/autotrace-query:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prisma Query DB Push
        run: |
          kubectl delete job prisma-query-db-push \
            -n autotrace \
            --ignore-not-found

          sed "s|IMAGE_PLACEHOLDER|hansongyi/autotrace-query:${GITHUB_SHA}|g" \
            k8s/prisma-query-job.yaml \
            | kubectl apply -f -

      - name: Wait for Prisma Query DB Push
        run: |
          kubectl wait \
            --for=condition=complete \
            --timeout=300s \
            job/prisma-query-db-push \
            -n autotrace
