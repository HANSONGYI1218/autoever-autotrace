apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: autotrace
type: Opaque
stringData:
  MARIADB_PASSWORD: "1234"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: autotrace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: autotrace
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
        - name: mariadb
          image: mariadb:11

          ports:
            - containerPort: 3306

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD

            - name: MARIADB_DATABASE
              value: "autotrace"

          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: autotrace
spec:
  type: ClusterIP

  selector:
    app: mariadb

  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
